[tool.black]
line-length = 120
target-version = ["py311"]
exclude = '''
/(
    \.eggs
  | \.git
  | \.tox
  | \.venv
  | venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
force_grid_wrap = 2
skip_glob = ["*/migrations/*", ".venv/*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
exclude = ["migrations/", "tests/"]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "myapp.settings"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
